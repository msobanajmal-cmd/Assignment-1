<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Me - Muhammad Soban Ajmal</title>
    <link href="style.css" rel="stylesheet" type="text/css" media="only screen and (min-width: 961px)">
    <link href="tablet.css" rel="stylesheet" type="text/css" media="only screen and (min-width: 481px) and (max-width: 960px)">
    <link href="mobile.css" rel="stylesheet" type="text/css" media="only screen and (max-width: 480px)">
</head>
<body>
    <div id="wrapper">
        <header>
            <h1>Muhammad Soban Ajmal</h1>
            <nav>
                <a class="button" href="index.html">Home</a>
                <a class="button" href="about.html">About Me</a>
                <a class="button" href="projects.html">Projects</a>
                <a class="button" href="contact.html">Contact Me</a>
            </nav>
            <div class="clear"></div>
        </header>
        <article>
            <h2>Contact Me</h2>
            <form action="mailto:msobanajmal@gmail.com" method="post" enctype="text/plain" name="contactForm">
                <p>
                    <label for="name">Your Name:</label><br>
                    <input type="text" name="name" size="40" required>
                </p>
                <p>
                    <label for="email">Your Email:</label><br>
                    <input type="email" name="email" size="40" required>
                </p>
                <p>
                    <label for="cell">Cell No.:</label><br>
                    <input type="tel" name="cell" size="40" required>
                </p>
                <p>
                    <label for="comments">Message:</label><br>
                    <textarea name="comments" cols="60" rows="6" required></textarea>
                </p>
                <p>
                    <input type="submit" value="Submit">
                    <input type="reset" value="Clear">
                </p>
            </form>
        </article>
        <footer>
            <address>Contact: <a href="mailto:msobanajmal@gmail.com">msobanajmal@gmail.com</a></address>
            <p>&copy; 2026 by Muhammad Soban Ajmal</p>
        </footer>
    </div>
</body>
